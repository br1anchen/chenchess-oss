[workspace]
members = [
  "services/coach-engine",
  "services/coach-engine/crates/contract",
  "services/coach-engine/crates/pipeline",
]
resolver = "2"

[workspace.package]
license = "AGPL-3.0-or-later"

[workspace.metadata]
name = "chenchess-rust"

[workspace.dependencies]
axum = "0.7"
tree-sitter = "0.25.8"
tree-sitter-pgn = "1.4.3"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
tokio = { version = "1.40", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing = "0.1"
serde_json_canonicalizer = "=0.3.2"
anyhow = "1.0"
base64 = "0.22"
flate2 = "1.0"
schemars = "=1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shakmaty = "0.27"
thiserror = "1.0"
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }
coach-engine-contract = { path = "services/coach-engine/crates/contract" }
coach-engine-pipeline = { path = "services/coach-engine/crates/pipeline" }
